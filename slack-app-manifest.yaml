---
# Rakuten MT4 Remote Login Agent V1
# Socket Mode does not need a public Request URL. The slash command intentionally
# omits `url`; Slack routes it over the WebSocket while socket_mode_enabled is true.
_metadata:
  major_version: 1
  minor_version: 1
display_information:
  name: Rakuten MT4 Remote Login Agent
  description: Local Windows agent for authorized Rakuten MT4 login automation
  background_color: "#0B1020"
features:
  # The Messages tab in App Home is where a user can type "/mt4 <alias> <credential>"
  # without the bot having to be invited to a channel first. Slack routes the slash
  # command itself, so no message event handler is needed for the command itself.
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: MT4 Login Agent
    always_online: false
  slash_commands:
    - command: /mt4
      description: Login to a configured Rakuten MT4 account or group
      usage_hint: "/mt4 <alias-or-group> <credential> | /mt4 status"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
settings:
  socket_mode_enabled: true
  org_deploy_enabled: false
  is_hosted: false
  token_rotation_enabled: false
