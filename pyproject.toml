[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rakuten-mt4-login-agent"
version = "1.0.0"
description = "Auditable Windows Slack agent for MT4 remote login"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "aiohttp>=3.10,<4.0",
  "slack-bolt>=1.20,<2.0",
  "slack-sdk>=3.33,<4.0",
  "pydantic>=2.10,<3.0",
  "psutil>=6.1,<8.0; sys_platform == 'win32'",
  "pywinauto>=0.6.8,<0.7; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<1.0",
  "ruff>=0.9,<1.0",
  "PyYAML>=6.0,<7.0",
]

[project.scripts]
mt4-login-agent = "app.main:run"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"app.web" = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]
