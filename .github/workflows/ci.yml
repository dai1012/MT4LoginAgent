name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # Windows is the primary platform: Windows-only behaviour is gated
    # behind sys.platform, so the real behaviour only runs here.
    # The ubuntu job keeps the portable behaviour covered.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Lint (ruff)
        run: ruff check .

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Check app.js parses
        run: node --check src/app/web/static/app.js

      - name: Run tests
        run: pytest -q
