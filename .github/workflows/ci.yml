name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # Windows is the primary platform: Windows-only behaviour is gated
    # behind sys.platform, so the real behaviour only runs here.
    # The ubuntu job keeps the portable behaviour covered.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      # Pinned to the current official majors: v7 of each action runs on the Node 24
      # runtime, so the Node 20 deprecation warning is resolved rather than tolerated.
      # None of the removed inputs is used here: setup-python v7 dropped `pip-install`,
      # setup-node v6 dropped `always-auth`, and this workflow installs with an explicit
      # `pip install` step.
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Lint (ruff)
        run: ruff check .

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Check app.js parses
        run: node --check src/app/web/static/app.js

      - name: Run tests
        run: pytest -q
